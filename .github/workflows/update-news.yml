name: Update Akwa Ibom News RSS

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest news
        run: python fetch_news.py

      - name: Generate RSS feed
        run: python generate_rss.py

      - name: Post new stories to Telegram
        run: python post_to_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_AKSNEWSBOT }}
          TELEGRAM_CHANNEL: ${{ secrets.AKWAIBOMNEWS }}

      - name: Commit updated news files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json feed.xml posted_news.json
          git diff --cached --quiet || git commit -m "Update Akwa Ibom news RSS"
          git push
